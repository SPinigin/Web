    <section class="feedback-section py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card shadow">
                        <div class="card-body p-4">
                            <form id="feedback-form" action="process-feedback.php" method="POST">
                                <div class="mb-4">
                                    <label for="name" class="form-label">Ваше имя <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="name" name="name" required>
                                </div>

                                <div class="mb-4">
                                    <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                                    <input type="email" class="form-control" id="email" name="email" required>
                                </div>

                                <div class="mb-4">
                                    <label for="phone" class="form-label">Телефон</label>
                                    <input type="tel" class="form-control" id="phone" name="phone">
                                </div>

                                <div class="mb-4">
                                    <label for="subject" class="form-label">Тема сообщения <span class="text-danger">*</span></label>
                                    <select class="form-select" id="subject" name="subject" required>
                                        <option value="">Выберите тему</option>
                                        <option value="booking">Вопрос по бронированию</option>
                                        <option value="price">Вопрос по ценам</option>
                                        <option value="facilities">Вопрос по удобствам</option>
                                        <option value="other">Другое</option>
                                    </select>
                                </div>

                                <div class="mb-4">
                                    <label for="message" class="form-label">Сообщение <span class="text-danger">*</span></label>
                                    <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
                                </div>

                                <div class="mb-4">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" id="privacy" name="privacy" required>
                                        <label class="form-check-label" for="privacy">
                                            Я согласен на обработку персональных данных
                                            <span class="text-danger">*</span>
                                        </label>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="fas fa-paper-plane me-2"></i>Отправить сообщение
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
