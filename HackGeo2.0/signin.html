<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация | HackGEO</title>
    <meta name="description" content="Страница авторизации HackGEO">
    <link rel="stylesheet" href="/assets/css/signin.css">
    <link rel="stylesheet" href="/assets/css/mainstyle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
    <main class="auth-container">
        <section class="auth-box">
            <header class="auth-header">
                <a href="index.html" class="logo-link">
                    <span class="logo-hack">Hack</span><span class="logo-geo">GEO</span>
                    <span class="logo-icon">🌍</span>
                </a>
                <h1>Вход в аккаунт</h1>
                <p class="auth-description">Войдите, чтобы получить доступ к материалам</p>
            </header>

            <form class="auth-form" action="/auth/login" method="POST">
                <div class="form-group">
                    <label for="login">Логин</label>
                    <div class="input-container">
                        <i class="ri-user-line"></i>
                        <input type="text" id="login" name="login" class="form-control" 
                               required placeholder="Введите логин"
                               autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <div class="input-container password-field">
                        <i class="ri-lock-line"></i>
                        <input type="password" id="password" name="password" class="form-control" 
                               required placeholder="Введите пароль"
                               autocomplete="current-password">
                        <button type="button" class="password-toggle" aria-label="Показать пароль">
                            <i class="ri-eye-line"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember" id="remember">
                        <span>Запомнить меня</span>
                    </label>
                    <a href="/reset-password" class="forgot-password">Забыли пароль?</a>
                </div>

                <button type="submit" class="submit-btn">
                    <i class="ri-login-circle-line"></i>
                    Войти
                </button>

                <footer class="auth-footer">
                    <p>Нет аккаунта? <a href="signup.html">Зарегистрироваться</a></p>
                </footer>
            </form>
        </section>
    </main>

    <script src="/assets/js/signin.js"></script>
</body>
</html>
