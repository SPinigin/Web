<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | HackGEO</title>
    <meta name="description" content="Страница регистрации HackGEO">
    <link rel="stylesheet" href="/assets/css/signup.css">
    <link rel="stylesheet" href="/assets/css/mainstyle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
    <main class="auth-container">
        <section class="auth-box">
            <header class="auth-header">
                <a href="index.html" class="logo-link">
                    <span class="logo-hack">Hack</span><span class="logo-geo">GEO</span>
                    <span class="logo-icon">🌍</span>
                </a>
                <h1>Регистрация</h1>
                <p class="auth-description">Создайте аккаунт для доступа к материалам</p>
            </header>

            <form class="auth-form" action="/auth/register" method="POST">
                <fieldset class="radio-group">
                    <legend><b>Кто Вы?</b></legend>
                    <label class="radio-option">
                        <input type="radio" name="whoareyou" value="student" checked>
                        <span>Студент</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="whoareyou" value="specialist">
                        <span>Специалист</span>
                    </label>
                </fieldset>

                <div class="form-group">
                    <label for="firstname">Имя</label>
                    <div class="input-container">
                        <i class="ri-user-line"></i>
                        <input type="text" id="firstname" name="firstname" class="form-control" 
                               required placeholder="Введите имя"
                               autocomplete="given-name">
                    </div>
                </div>

                <div class="form-group">
                    <label for="lastname">Фамилия</label>
                    <div class="input-container">
                        <i class="ri-user-line"></i>
                        <input type="text" id="lastname" name="lastname" class="form-control" 
                               required placeholder="Введите фамилию"
                               autocomplete="family-name">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-container">
                        <i class="ri-mail-line"></i>
                        <input type="email" id="email" name="email" class="form-control" 
                               required placeholder="Введите email"
                               autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label for="username">Логин</label>
                    <div class="input-container">
                        <i class="ri-user-3-line"></i>
                        <input type="text" id="username" name="username" class="form-control" 
                               required placeholder="Придумайте логин"
                               autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <div class="input-container password-field">
                        <i class="ri-lock-line"></i>
                        <input type="password" id="password" name="password" class="form-control" 
                               required placeholder="Придумайте пароль"
                               autocomplete="new-password">
                        <button type="button" class="password-toggle" aria-label="Показать пароль">
                            <i class="ri-eye-line"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="passwordapproval">Подтверждение пароля</label>
                    <div class="input-container password-field">
                        <i class="ri-lock-line"></i>
                        <input type="password" id="passwordapproval" name="passwordapproval" 
                               class="form-control" required placeholder="Повторите пароль"
                               autocomplete="new-password">
                        <button type="button" class="password-toggle" aria-label="Показать пароль">
                            <i class="ri-eye-line"></i>
                        </button>
                    </div>
                    <div class="error-container">
                        <div id="password-error" class="error-message" role="alert">Пароли не совпадают</div>
                    </div>
                </div>

                <fieldset id="student-fields">
                    <div class="form-group">
                        <label for="university">Институт</label>
                        <div class="input-container">
                            <i class="ri-building-line"></i>
                            <select name="university" id="university" class="form-control" required>
                                <option value="">Выберите институт</option>
                                <option value="igin">ИГиН</option>
                                <option value="vshct">ВШЦТ</option>
                                <option value="stroin">СТРОИН</option>
                                <option value="arhid">АРХИД</option>
                                <option value="iddo">ИДДО</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="group">Группа</label>
                        <div class="input-container">
                            <i class="ri-group-line"></i>
                            <input type="text" id="group" name="group" class="form-control" 
                                   required placeholder="Введите группу">
                        </div>
                    </div>
                </fieldset>

                <fieldset id="specialist-fields" class="hidden">
                    <div class="form-group">
                        <label for="occupation">Род деятельности</label>
                        <div class="input-container">
                            <i class="ri-briefcase-line"></i>
                            <input type="text" id="occupation" name="occupation" class="form-control" 
                                   placeholder="Укажите род деятельности">
                        </div>
                    </div>
                </fieldset>

                <button type="submit" class="submit-btn">
                    <i class="ri-user-add-line"></i>
                    Создать аккаунт
                </button>

                <div class="auth-footer">
                    <p>Уже есть аккаунт? <a href="signin.html">Войти</a></p>
                <div>
            </form>
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/assets/js/signup.js"></script>
</body>
</html>
