
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль | HackGEO</title>
    <meta name="description" content="Профиль пользователя HackGEO">
    <link rel="stylesheet" href="assets/css/mainstyle.css">
    <link rel="stylesheet" href="assets/css/profile.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        
    </header>

    <main class="profile-container">
        <div class="profile-card">
            <div class="profile-header">
                <div class="profile-avatar">
                    <img id="avatar-preview" src="/assets/img/default-avatar.jpg" alt="Фото профиля">
                    <div class="avatar-upload">
                        <label for="avatar-input">
                            <i class="ri-camera-line"></i>
                            Изменить фото
                        </label>
                        <input type="file" id="avatar-input" accept="image/*">
                    </div>
                </div>
                <div class="profile-info">
                    <h1 id="user-name">Иванов Иван</h1>
                    <p class="user-status">Студент</p>
                    <p class="last-login">Последний вход: 23.05.2024 17:30</p>
                </div>
            </div>

            <div class="profile-details">
                <div class="detail-section">
                    <h2>Личная информация</h2>
                    <div class="detail-grid">
                        <div class="detail-item">
                            <label>Имя</label>
                            <p id="first-name">Иван</p>
                        </div>
                        <div class="detail-item">
                            <label>Фамилия</label>
                            <p id="last-name">Иванов</p>
                        </div>
                        <div class="detail-item">
                            <label>Email</label>
                            <p id="email">ivan@example.com</p>
                        </div>
                        <div class="detail-item">
                            <label>Институт</label>
                            <p id="institute">ИГиН</p>
                        </div>
                        <div class="detail-item">
                            <label>Группа</label>
                            <p id="group">ГДб-23-1</p>
                        </div>
                        <div class="detail-item">
                            <label>Дата регистрации</label>
                            <p id="register-date">20.05.2024</p>
                        </div>
                    </div>
                </div>

                <div class="profile-actions">
                    <button id="edit-profile-btn" class="btn primary-btn">
                        <i class="ri-edit-line"></i>
                        Редактировать профиль
                    </button>
                    <button id="change-password-btn" class="btn secondary-btn">
                        <i class="ri-lock-password-line"></i>
                        Изменить пароль
                    </button>
                </div>
            </div>
        </div>
    </main>

    
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Редактирование профиля</h2>
                <button class="close-modal">×</button>
            </div>
            <form id="edit-profile-form">
                <div class="form-group">
                    <label for="edit-first-name">Имя</label>
                    <input type="text" id="edit-first-name" name="firstName" required>
                </div>
                <div class="form-group">
                    <label for="edit-last-name">Фамилия</label>
                    <input type="text" id="edit-last-name" name="lastName" required>
                </div>
                <div class="form-group">
                    <label for="edit-email">Email</label>
                    <input type="email" id="edit-email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="edit-institute">Институт</label>
                    <select id="edit-institute" name="institute" required>
                        <option value="igin">ИГиН</option>
                        <option value="vshct">ВШЦТ</option>
                        <option value="stroin">СТРОИН</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="edit-group">Группа</label>
                    <input type="text" id="edit-group" name="group" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn secondary-btn" id="cancel-edit">Отмена</button>
                    <button type="submit" class="btn primary-btn">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    
    <div id="password-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Изменение пароля</h2>
                <button class="close-modal">×</button>
            </div>
            <form id="change-password-form">
                <div class="form-group">
                    <label for="current-password">Текущий пароль</label>
                    <input type="password" id="current-password" name="currentPassword" required>
                </div>
                <div class="form-group">
                    <label for="new-password">Новый пароль</label>
                    <input type="password" id="new-password" name="newPassword" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Подтвердите пароль</label>
                    <input type="password" id="confirm-password" name="confirmPassword" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn secondary-btn" id="cancel-password">Отмена</button>
                    <button type="submit" class="btn primary-btn">Изменить пароль</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="/assets/js/mainscript.js"></script>
    <script src="/assets/js/profile.js"></script>
</body>
</html>
